name: Correção automática — AP1-01

# Roda automaticamente sempre que um Pull Request é aberto ou atualizado
# (o fluxo de entrega usado nas práticas: aluno faz fork, edita o código,
# e abre um PR de volta para este repositório).
#
# Também pode ser rodado manualmente pela aba "Actions" do GitHub,
# usando o botão "Run workflow" (workflow_dispatch).
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  corrigir:
    name: Corrigir Questões 5 e 6
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do Pull Request
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar correção automática
        run: node scripts/corrigir.mjs
